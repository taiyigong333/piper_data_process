# Piper 玉米放盘任务的默认转换配置。
# 源 HDF5 与采集 YAML 只读取，不依赖采集工程中的 Python 代码。
source:
  hdf5_root: /home/ubuntu/gcj/projects/data_collect/data/corm_in_plate/real/20260720
  trajectory_glob: "**/trajectory.hdf5"
  collection_config: /home/ubuntu/gcj/projects/data_collect/piper_with_pica/configs/pick_up_the_corn_and_put_it_on_the_plate.yaml

output:
  # repo_id 是 LeRobot/OpenPI 的数据集标识；root 是本地数据集目录。
  repo_id: taiyigong333/piper_corn_in_plate
  # 与 HF_LEROBOT_HOME=<data_processed>/datasets 组合后，可被 OpenPI 的标准加载器直接发现。
  root: ../datasets/taiyigong333/piper_corn_in_plate
  robot_type: piper
  # null 时读取 collection_config.acquisition.camera_rig_hz。
  fps: null
  # true: 使用项目 uv 环境中的静态 FFmpeg 生成 MP4；false: 将图片嵌入 Parquet。
  # 当前机器的标准 LeRobot 视频解码依赖系统动态 FFmpeg，训练默认使用图片模式。
  use_videos: false
  video_codec: libx264
  video_preset: medium
  video_crf: 23
  video_keyframe_interval: 30
  image_writer_processes: 4
  image_writer_threads: 4
  overwrite: false

representation:
  # 可选 joint_positions 或 tcp_pose。两者均会在末尾拼接夹爪位置（若 include_gripper=true）。
  state_source: joint_positions
  include_gripper: true
  # absolute: 下一图像时刻的绝对目标；relative: 当前到下一时刻的增量，夹爪仍为绝对开度。
  # 默认保留 absolute；OpenPI 训练端可通过 extra_delta_transform=True 转为相对关节动作。
  action_representation: absolute
  # 物理反馈不是控制命令，故以“下一图像时刻的反馈状态”作为行为克隆监督目标。
  action_horizon_frames: 1

alignment:
  # previous 是因果对齐：只使用拍摄时刻之前最近的 60Hz 机器人反馈，绝不读取未来状态。
  strategy: previous
  # null 时读取 collection_config.acquisition.max_alignment_age_ms。
  max_state_age_ms: null

images:
  # null 可保持原图大小；此处按要求等比例缩小后居中黑边补齐到 224 x 224。
  target_width: 224
  target_height: 224
  pad_rgb: [0, 0, 0]
  validate_source_size: true
  cameras:
    - source_name: camera_front
      feature_name: image
    - source_name: camera_wrist_right
      feature_name: wrist_image

description:
  task: "pick up the corn and put it on the plate"
  intended_model: "OpenPI fine-tuning via LeRobotLiberoDataConfig(extra_delta_transform=True)"
  notes: "Piper real-robot teleoperation data; RGB frames are resized with aspect ratio preserved and padded."
